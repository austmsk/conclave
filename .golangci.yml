version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gocyclo
    - gocognit
    - funlen
    - nestif
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 60
      statements: 50
    nestif:
      min-complexity: 5
