# Repository toolchains: each repository's configured test, build and lint
# commands (FR-I4), offered to the agent as run_tests, run_build and
# run_lint, and its profile, which the agent prompt describes. Loaded and
# validated at startup by agent.LoadToolchains
# (internal/agent/toolchains.go).
#
# Repositories are keyed by full name, the same keys as deploy/repos.yaml.
# Only the owner edits this file; never derive it from the target
# repository, because the agent cannot change or add to these commands.
#
# The placeholder fails validation on purpose, so the worker refuses to
# start until a real entry is filled in:
#   owner/repo     replace with the repository's full name.
#
# Each command is an argv list, run exactly as written in the workspace
# root with no shell; for pipes or redirection, write [sh, -c, "..."].
#   test:   runs the test suite         (run_tests)
#   build:  builds the project          (run_build)
#   lint:   runs the linters            (run_lint)
# All three are required: the implementer role offers all three tools, and
# a role whose tools the worker cannot provide fails every attempt. A
# repository with nothing to run for one of them can use [true], which
# succeeds without doing anything. No process survives between
# commands, so each must be self-contained: a command that needs a running
# service has to start it itself.
#
# The test command must also write a JUnit XML report under
# /tmp/conclave-junit/ (gate.JUnitDir). The tests gate passes only when
# the command exits 0 and that report shows at least one test ran and none
# failed or errored; an exit code alone is not trusted. The directory is
# deleted before each run, so the command recreates it. The placeholder's
# [go, test, ./...] writes no report and would fail every attempt; for Go,
# use for example
#   [sh, -c, "mkdir -p /tmp/conclave-junit && exec gotestsum --junitfile /tmp/conclave-junit/go.xml -- ./..."]
# with gotestsum in the sandbox image. A JUnit 5 project adds
# --reports-dir=/tmp/conclave-junit to the console launcher.
#
# Each repository also has a profile block, beside the commands, telling
# the agent what the repository is. The agent prompt renders all three
# fields under "Repository", with the full name taken from the key, so
# write them for a model reading them cold, in a line or two each:
#   language:     the main language, e.g. Java or Go
#   layout_hint:  where sources, tests and anything vendored live
#   conventions:  naming, error handling and test style; the build tool
#                 or its absence
# All three are required and must not be blank. The owner maintains them
# by hand until Milestone 3's generated codebase brief replaces them. Like
# the commands, they come from the owner, never from the repository.

repositories:
  owner/repo:
    test: [go, test, ./...]   # writes no JUnit report: replace it (see above)
    build: [go, build, ./...]
    lint: [golangci-lint, run]
    profile:
      language: Go
      layout_hint: "Packages under internal/, commands under cmd/, tests beside the code they test"
      conventions: "Table-driven tests; errors wrapped with context; standard library first"
